<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050b14;
    --panel: #0a1524;
    --panel-2: #0d1c30;
    --blue: #29d3ff;
    --blue-deep: #0c63ff;
    --blue-dim: #123a5e;
    --blue-faint: rgba(41, 211, 255, 0.08);
    --text: #cfe8ff;
    --text-dim: #5f88a8;
    --text-faint: #2f4a63;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    overflow: hidden;
  }

  body {
    background-image:
      linear-gradient(var(--blue-faint) 1px, transparent 1px),
      linear-gradient(90deg, var(--blue-faint) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .scanline {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--blue), transparent);
    opacity: 0.6;
    animation: sweep 6s linear infinite;
    pointer-events: none;
    z-index: 50;
  }

  @keyframes sweep {
    0% { top: 0%; opacity: 0; }
    5% { opacity: 0.6; }
    95% { opacity: 0.6; }
    100% { top: 100%; opacity: 0; }
  }

  .shell {
    height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 860px;
    margin: 0 auto;
    padding: 20px;
  }

  /* top bar */
  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 20px;
    border: 1px solid var(--blue-dim);
    background: linear-gradient(180deg, var(--panel), var(--bg));
    position: relative;
    flex-shrink: 0;
  }

  .corner {
    position: absolute;
    width: 14px;
    height: 14px;
    border: 2px solid var(--blue);
  }
  .corner.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .corner.tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
  .corner.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .reactor {
    width: 42px;
    height: 42px;
    position: relative;
    flex-shrink: 0;
  }
  .reactor .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid var(--blue);
    opacity: 0.9;
  }
  .reactor .ring.r2 {
    inset: 8px;
    border-color: var(--blue-deep);
    animation: spin 4s linear infinite;
    border-style: dashed;
  }
  .reactor .core {
    position: absolute;
    inset: 15px;
    border-radius: 50%;
    background: var(--blue);
    box-shadow: 0 0 12px 3px var(--blue);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse {
    0%, 100% { opacity: 0.6; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1); }
  }

  .brand {
    flex: 1;
  }
  .brand h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 4px;
    margin: 0;
    color: var(--blue);
  }
  .brand .sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .status {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #3dffb0;
    box-shadow: 0 0 6px 1px #3dffb0;
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* chat panel */
  .panel {
    flex: 1;
    margin-top: 16px;
    border: 1px solid var(--blue-dim);
    background: rgba(10, 21, 36, 0.5);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: var(--blue-dim); }
  .messages::-webkit-scrollbar-track { background: transparent; }

  .msg-row {
    display: flex;
    flex-direction: column;
    max-width: 78%;
    animation: rise 0.3s ease;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user { align-self: flex-end; align-items: flex-end; }
  .msg-row.jarvis { align-self: flex-start; align-items: flex-start; }

  .msg-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text-faint);
    margin-bottom: 4px;
    padding: 0 2px;
  }

  .bubble {
    padding: 12px 16px;
    font-size: 16px;
    line-height: 1.5;
    font-weight: 500;
  }

  .msg-row.user .bubble {
    background: var(--blue-deep);
    color: #eaf6ff;
    border: 1px solid var(--blue);
  }

  .msg-row.jarvis .bubble {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--blue-dim);
    border-left: 2px solid var(--blue);
  }

  .typing {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 4px;
  }
  .typing .mini-reactor {
    width: 16px;
    height: 16px;
    border: 2px solid var(--blue);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .typing span.txt {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--text-dim);
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-faint);
  }
  .empty-state .reactor {
    margin: 0 auto 16px;
    width: 64px;
    height: 64px;
  }
  .empty-state .reactor .core { inset: 22px; }
  .empty-state p {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    letter-spacing: 2px;
  }

  /* input bar */
  .inputbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    border-top: 1px solid var(--blue-dim);
    background: var(--panel);
    flex-shrink: 0;
  }

  .inputbar input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }
  .inputbar input::placeholder { color: var(--text-faint); }

  .inputbar .prompt-char {
    color: var(--blue);
    font-family: 'Share Tech Mono', monospace;
    font-size: 16px;
  }

  .send-btn {
    background: transparent;
    border: 1px solid var(--blue);
    color: var(--blue);
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 10px 18px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .send-btn:hover { background: var(--blue); color: #051018; }
  .send-btn:disabled {
    opacity: 0.35;
    cursor: default;
    background: transparent;
    color: var(--blue);
  }

  .upload-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--blue-dim);
    color: var(--text-dim);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 8px 14px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
    flex-shrink: 0;
  }
  .upload-btn:hover {
    border-color: var(--blue);
    color: var(--blue);
  }
  .upload-btn.uploading {
    border-color: var(--blue);
    color: var(--blue);
  }

  .knowledge-note {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--text-faint);
    padding: 6px 2px 0;
  }
  .knowledge-note.error { color: #ff6b6b; }
  .knowledge-note.ok { color: #3dffb0; }

  @media (prefers-reduced-motion: reduce) {
    .scanline, .reactor .ring.r2, .reactor .core, .status .dot, .mini-reactor {
      animation: none !important;
    }
  }

  @media (max-width: 600px) {
    .shell { padding: 10px; }
    .brand h1 { font-size: 16px; letter-spacing: 2px; }
    .msg-row { max-width: 90%; }
  }
</style>
</head>
<body>

<div class="scanline"></div>

<div class="shell">

  <div class="topbar">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="reactor">
      <div class="ring"></div>
      <div class="ring r2"></div>
      <div class="core"></div>
    </div>

    <div class="brand">
      <h1>J.A.R.V.I.S.</h1>
      <div class="sub">JUST A RATHER VERY INTELLIGENT SYSTEM</div>
    </div>

    <div class="status">
      <span class="dot"></span>
      ONLINE
    </div>

    <label class="upload-btn" for="fileInput">
      <span id="uploadLabel">UPLOAD</span>
      <input type="file" id="fileInput" accept=".pdf,.txt,.csv" hidden />
    </label>
  </div>

  <div class="panel">
    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="reactor">
          <div class="ring"></div>
          <div class="ring r2"></div>
          <div class="core"></div>
        </div>
        <p>SYSTEMS NOMINAL — AWAITING INPUT</p>
      </div>
    </div>

    <div class="inputbar">
      <span class="prompt-char">&gt;</span>
      <input type="text" id="msgInput" placeholder="Ask me anything, sir..." autocomplete="off" />
      <button class="send-btn" id="sendBtn">SEND</button>
    </div>
    <div class="knowledge-note" id="uploadNote"></div>
  </div>

</div>

<script>
  const messagesEl = document.getElementById('messages');
  const emptyState = document.getElementById('emptyState');
  const input = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');

  let history = [];
  let isSending = false;

  function addMessage(role, content) {
    if (emptyState) emptyState.remove();

    const row = document.createElement('div');
    row.className = 'msg-row ' + (role === 'user' ? 'user' : 'jarvis');

    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = role === 'user' ? 'YOU' : 'JARVIS';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = content;

    row.appendChild(label);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row jarvis';
    row.id = 'typingRow';

    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = 'JARVIS';

    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.innerHTML = '<div class="mini-reactor"></div><span class="txt">PROCESSING...</span>';

    row.appendChild(label);
    row.appendChild(typing);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const row = document.getElementById('typingRow');
    if (row) row.remove();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || isSending) return;

    isSending = true;
    sendBtn.disabled = true;
    input.value = '';

    addMessage('user', text);
    addTyping();

    try {
      const res = await fetch('/UCHAT/Chatbot', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ msg: text, history: history })
      });

      removeTyping();

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        addMessage('jarvis', 'System error: ' + (err.detail || res.status));
      } else {
        const data = await res.json();
        addMessage('jarvis', data.reply);
        history.push({ role: 'user', content: text });
        history.push({ role: 'assistant', content: data.reply });
      }
    } catch (e) {
      removeTyping();
      addMessage('jarvis', 'Connection lost. Unable to reach the server.');
    } finally {
      isSending = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  input.focus();

  // --- file upload / RAG ingest ---
  const fileInput = document.getElementById('fileInput');
  const uploadLabel = document.getElementById('uploadLabel');
  const uploadBtn = document.querySelector('.upload-btn');
  const uploadNote = document.getElementById('uploadNote');

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;

    const allowed = ['.pdf', '.txt', '.csv'];
    const ext = '.' + file.name.split('.').pop().toLowerCase();
    if (!allowed.includes(ext)) {
      uploadNote.textContent = 'UNSUPPORTED FILE TYPE: ' + ext;
      uploadNote.className = 'knowledge-note error';
      fileInput.value = '';
      return;
    }

    uploadBtn.classList.add('uploading');
    uploadLabel.textContent = 'UPLOADING...';
    uploadNote.textContent = '';
    uploadNote.className = 'knowledge-note';

    const formData = new FormData();
    formData.append('file', file);

    try {
      const res = await fetch('/UCHAT/INGEST', {
        method: 'POST',
        body: formData
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        uploadNote.textContent = 'INGEST FAILED: ' + (data.detail || res.status);
        uploadNote.className = 'knowledge-note error';
      } else {
        uploadNote.textContent =
          data.filename + ' — ' + data.chunks_added + ' chunks added to knowledge base (' +
          data.total_chunks_in_db + ' total)';
        uploadNote.className = 'knowledge-note ok';
      }
    } catch (e) {
      uploadNote.textContent = 'CONNECTION LOST DURING UPLOAD';
      uploadNote.className = 'knowledge-note error';
    } finally {
      uploadBtn.classList.remove('uploading');
      uploadLabel.textContent = 'UPLOAD';
      fileInput.value = '';
    }
  });
</script>

</body>
</html>
